  <style>:where(svg) [class*="ila-"]{transform-box:fill-box;transform-origin:center;--ila-k:1.8;animation-delay:var(--d,0s);animation-iteration-count:infinite;animation-fill-mode:both;}.ila-float{animation-name:ila-float;animation-duration:var(--t,3s);animation-timing-function:ease-in-out;}@keyframes ila-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.ila-drop{animation-name:ila-drop;animation-duration:var(--t,5s);animation-timing-function:cubic-bezier(.3,.7,.4,1);}@keyframes ila-drop{0%{transform:translateY(calc(var(--y,-12px) * var(--ila-k)));opacity:0}16%{transform:translateY(0);opacity:1}21%{transform:translateY(-5px)}27%,84%{transform:translateY(0);opacity:1}96%,100%{transform:translateY(0);opacity:0}}.ila-slide{animation-name:ila-slide;animation-duration:var(--t,5s);animation-timing-function:cubic-bezier(.3,.7,.4,1);}@keyframes ila-slide{0%{transform:translate(calc(var(--x,0px) * var(--ila-k)),calc(var(--y,0px) * var(--ila-k)));opacity:0}24%,84%{transform:translate(0,0);opacity:1}96%,100%{transform:translate(0,0);opacity:0}}.ila-send{animation-name:ila-send;animation-duration:var(--t,5s);animation-timing-function:ease-in;}@keyframes ila-send{0%,24%{transform:translate(0,0);opacity:1}56%{transform:translate(calc(var(--x,18px) * var(--ila-k)),calc(var(--y,-6px) * var(--ila-k)));opacity:0}57%,70%{transform:translate(0,0);opacity:0}86%,100%{transform:translate(0,0);opacity:1}}.ila-scan{animation-name:ila-scan;animation-duration:var(--t,5s);animation-timing-function:ease-in-out;}@keyframes ila-scan{0%,6%,100%{transform:translate(0,0)}40%,60%{transform:translate(var(--x,12px),var(--y,0))}}.ila-flow{animation-name:ila-flow;animation-duration:var(--t,0.9s);animation-timing-function:linear;}@keyframes ila-flow{from{stroke-dashoffset:0}to{stroke-dashoffset:-10.8}}.ila-pop{animation-name:ila-pop;animation-duration:var(--t,5s);animation-timing-function:cubic-bezier(.3,1.6,.5,1);}@keyframes ila-pop{0%,30%{transform:scale(0);opacity:0}40%{transform:sc