t;}@keyframes ila-swing{0%,40%,100%{transform:rotate(0)}45%{transform:rotate(18deg)}51%{transform:rotate(-15deg)}57%{transform:rotate(10deg)}63%{transform:rotate(-6deg)}69%{transform:rotate(3deg)}75%{transform:rotate(0)}}.ila-close{animation-name:ila-close;animation-duration:var(--t,5s);animation-timing-function:cubic-bezier(.5,0,.3,1.4);}@keyframes ila-close{0%,18%{transform:translateY(calc(var(--y,-3.5px) * var(--ila-k)))}32%,86%{transform:translateY(0)}100%{transform:translateY(calc(var(--y,-3.5px) * var(--ila-k)))}}.ila-dim{animation-name:ila-dim;animation-duration:var(--t,5s);animation-timing-function:ease-in-out;}@keyframes ila-dim{0%,22%{opacity:1}40%,84%{opacity:.25}100%{opacity:1}}.ila-on-hover:not(:hover):not(:focus-visible):not(:focus-within):where(svg) [class*="ila-"]{animation:none;}.ila-on-hover:not(:hover):not(:focus-visible):not(:focus-within):where(svg) .ila-pulse{visibility:hidden;}@media (prefers-reduced-motion:reduce){:where(svg) [class*="ila-"]{animation:none !important;}:where(svg) .ila-pulse{visibility:hidden;}}</style>
