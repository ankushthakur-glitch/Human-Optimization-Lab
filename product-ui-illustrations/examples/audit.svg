        flood-color="var(--il-shadow-c, #4A3F33)" flood-opacity="var(--il-shadow-o, 0.16)"/>
    </filter>
    <filter id="liftL-audit" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="5"
        flood-color="var(--il-shadow-c, #4A3F33)" flood-opacity="var(--il-shadow-o, 0.16)"/>
    </filter>
  </defs>
  <g mask="url(#fade-audit)">
<rect x="36" y="16" width="104" height="152" rx="10" fill="var(--il-ghost, #EAE7E2)" stroke="var(--il-line, #B9B1A4)" stroke-width="0.5"/><path d="M28 18a10 10 0 0 1 10 -10h84a10 10 0 0 1 10 10V160H28z" fill="url(#panelG-audit)" stroke="var(--il-line, #B9B1A4)" stroke-width="0.5"/><g class="ila-pulse"><circle cx="44.0" cy="56.0" r="3.6" fill="var(--il-accent, #3E9077)"/></g><rect x="44" y="56" width="0.5" height="70" fill="var(--il-line, #B9B1A4)" opacity="0.7"/><circle cx="44.0" cy="56.0" r="3.6" fill="var(--il-accent, #3E9077)"/><circle cx="44.0" cy="80.0" r="3.6" fill="var(--il-fill, #DCD6CE)"/><circle cx="44.0" cy="104.0" r="3.6" fill="var(--il-fill, #DCD6CE)"/><rect x="58.0" y="49.0" width="22.0" height="4.2" rx="2.10" fill="var(--il-fill, #DCD6CE)"/><rect x="58.0" y="56.4" width="50.0" height="5.2" rx="2.60" fill="var(--il-fill, #DCD6CE)"/><rect x="58.0" y="73.0" width="22.0" height="4.2" rx="2.10" fill="var(--il-fill, #DCD6CE)"/><rect x="58.0" y="80.4" width="50.0" height="5.2" rx="2.60" fill="var(--il-fill, #DCD6CE)"/><rect x="58.0" y="97.0" width="22.0" height="4.2" rx="2.10" fill="var(--il-fill, #DCD6CE)"/><rect x="58.0" y="104.4" width="50.0" height="5.2" rx="2.60" fill="var(--il-fill, #DCD6CE)"/><rect x="102.0" y="22.0" width="18.0" height="4.6" rx="2.30" fill="var(--il-fill, #DCD6CE)"/><circle cx="124.0" cy="20.9" r="1.15" fill="var(--il-stroke-soft, #9B948A)"/><circle cx="124.0" cy="24.5" r="1.15" fill="var(--il-stroke-soft, #9B948A)"/><circle cx="124.0" cy="28.1" r="1.15" fill="var(--il-stroke-soft, #9B948A)"/>
  </g>
<g filter="url(#lift-audit)"><rect x="18.0" y="14.0" width="74.0" height="22.0" rx="8.0" fill="var(--il-surface, #FFFFFF)" stroke="var(--il-line, #B9B1A4)" stroke-width="0.5"/></g><g transform="translate(27.00 19.00) scale(0.04688)" fill="var(--il-stroke, #35322D)"><path d="M136,80v43.47l36.12,21.67a8,8,0,0,1-8.24,13.72l-40-24A8,8,0,0,1,120,128V80a8,8,0,0,1,16,0Zm-8-48A95.44,95.44,0,0,0,60.08,60.15C52.81,67.51,46.35,74.59,40,82V64a8,8,0,0,0-16,0v40a8,8,0,0,0,8,8H72a8,8,0,0,0,0-16H49c7.15-8.42,14.27-16.35,22.39-24.57a80,80,0,1,1,1.66,114.75,8,8,0,1,0-11,11.64A96,96,0,1,0,128,32Z"/></g><rect x="44.0" y="22.4" width="34.0" height="4.6" rx="2.30" fill="var(--il-fill, #DCD6CE)"/>
