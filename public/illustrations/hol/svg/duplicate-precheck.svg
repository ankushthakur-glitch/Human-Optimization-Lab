<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" width="320" height="320" role="img" aria-label="Checking for duplicates"> <style>:where(svg) [class*="ila-"] { transform-box: fill-box; transform-origin: center; --ila-k: 1.8; animation-delay: var(--d, 0s); animation-iteration-count: infinite; animation-fill-mode: both; } .ila-float { animation-name: ila-float; animation-duration: var(--t, 3s); animation-timing-function: ease-in-out; } @keyframes ila-float { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-5px) } } .ila-drop { animation-name: ila-drop; animation-duration: var(--t, 5s); animation-timing-function: cubic-bezier(.3, .7, .4, 1); } @keyframes ila-drop { 0% { transform: translateY(calc(var(--y, -12px) * var(--ila-k))); opacity: 0 } 16% { transform: translateY(0); opacity: 1 } 21% { transform: translateY(-5px) } 27%, 84% { transform: translateY(0); opacity: 1 } 96%, 100% { transform: translateY(0); opacity: 0 } } .ila-slide { animation-name: ila-slide; animation-duration: var(--t, 5s); animation-timing-function: cubic-bezier(.3, .7, .4, 1); } @keyframes ila-slide { 0% { transform: translate(calc(var(--x, 0px) * var(--ila-k)), calc(var(--y, 0px) * var(--ila-k))); opacity: 0 } 24%, 84% { transform: translate(0, 0); opacity: 1 } 96%, 100% { transform: translate(0, 0); opacity: 0 } } .ila-send { animation-name: ila-send; animation-duration: var(--t, 5s); animation-timing-function: ease-in; } @keyframes ila-send { 0%, 24% { transform: translate(0, 0); opacity: 1 } 56% { transform: translate(calc(var(--x, 18px) * var(--ila-k)), calc(var(--y, -6px) * var(--ila-k))); opacity: 0 } 57%, 70% { transform: translate(0, 0); opacity: 0 } 86%, 100% { transform: translate(0, 0); opacity: 1 } } .ila-scan { animation-name: ila-scan; animation-duration: var(--t, 5s); animation-timing-function: ease-in-out; } @keyframes ila-scan { 0%, 6%, 100% { transform: translate(0, 0) } 40%, 60% { transform: translate(var(--x, 12px), var(--y, 0)) } } .ila-flow { animation-name: ila-flow; animation-duration: var(--t, 0.9s); animation-timing-function: linear; } @keyframes ila-flow { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -10.8 } } .ila-pop { animation-name: ila-pop; animation-duration: var(--t, 5s); animation-timing-function: cubic-bezier(.3, 1.6, .5, 1); } @keyframes ila-pop { 0%, 30% { transform: scale(0); opacity: 0 } 40% { transform: scale(1.35); opacity: 1 } 47% { transform: scale(.9) } 53% { transform: scale(1) } 88% { transform: scale(1); opacity: 1 } 96%, 100% { transform: scale(0); opacity: 0 } } .ila-pulse { animation-name: ila-pulse; animation-duration: var(--t, 2.4s); animation-timing-function: ease-out; } @keyframes ila-pulse { 0% { transform: scale(1); opacity: .7 } 75%, 100% { transform: scale(3.2); opacity: 0 } } .ila-spin { animation-name: ila-spin; animation-duration: var(--t, 2.4s); animation-timing-function: linear; } @keyframes ila-spin { to { transform: rotate(360deg) } } .ila-blink { animation-name: ila-blink; animation-duration: var(--t, 1.1s); animation-timing-function: steps(1); } @keyframes ila-blink { 50% { opacity: 0 } } .ila-grow { transform-origin: left center; animation-name: ila-grow; animation-duration: var(--t, 5s); animation-timing-function: cubic-bezier(.4, 0, .2, 1); } @keyframes ila-grow { 0% { transform: scaleX(0); opacity: 1 } 40%, 86% { transform: scaleX(1); opacity: 1 } 96%, 100% { transform: scaleX(1); opacity: 0 } } .ila-grow-y { transform-origin: center bottom; animation-name: ila-grow-y; animation-duration: var(--t, 5s); animation-timing-function: cubic-bezier(.4, 0, .2, 1); } @keyframes ila-grow-y { 0% { transform: scaleY(0); opacity: 1 } 36%, 86% { transform: scaleY(1); opacity: 1 } 96%, 100% { transform: scaleY(1); opacity: 0 } } .ila-rise { animation-name: ila-rise; animation-duration: var(--t, 5s); animation-timing-function: ease-out; } @keyframes ila-rise { 0% { transform: translateY(9px); opacity: 0 } 16%, 86% { transform: translateY(0); opacity: 1 } 96%, 100% { transform: translateY(0); opacity: 0 } } .ila-shake { animation-name: ila-shake; animation-duration: var(--t, 4s); animation-timing-function: ease-in-out; } @keyframes ila-shake { 0%, 40%, 100% { transform: translateX(0) } 44% { transform: translateX(-4px) rotate(-3deg) } 48% { transform: translateX(4px) rotate(3deg) } 52% { transform: translateX(-3.5px) rotate(-2deg) } 56% { transform: translateX(3.5px) rotate(2deg) } 60% { transform: translateX(-2px) } 64% { transform: translateX(2px) } 68% { transform: translateX(0) } } .ila-swing { transform-origin: top center; animation-name: ila-swing; animation-duration: var(--t, 4s); animation-timing-function: ease-in-out; } @keyframes ila-swing { 0%, 40%, 100% { transform: rotate(0) } 45% { transform: rotate(18deg) } 51% { transform: rotate(-15deg) } 57% { transform: rotate(10deg) } 63% { transform: rotate(-6deg) } 69% { transform: rotate(3deg) } 75% { transform: rotate(0) } } .ila-close { animation-name: ila-close; animation-duration: var(--t, 5s); animation-timing-function: cubic-bezier(.5, 0, .3, 1.4); } @keyframes ila-close { 0%, 18% { transform: translateY(calc(var(--y, -3.5px) * var(--ila-k))) } 32%, 86% { transform: translateY(0) } 100% { transform: translateY(calc(var(--y, -3.5px) * var(--ila-k))) } } .ila-dim { animation-name: ila-dim; animation-duration: var(--t, 5s); animation-timing-function: ease-in-out; } @keyframes ila-dim { 0%, 22% { opacity: 1 } 40%, 84% { opacity: .25 } 100% { opacity: 1 } } @media (prefers-reduced-motion: reduce) { :where(svg) [class*="ila-"] { animation: none !important; } :where(svg) .ila-pulse { visibility: hidden; } }</style><defs> <linearGradient id="fadeG-duplicate-precheck-hol" x1="0" y1="0" x2="0" y2="1"> <stop offset="0.7" stop-color="#fff"/><stop offset="0.82" stop-color="#000"/> </linearGradient> <mask id="fade-duplicate-precheck-hol"><rect width="160" height="160" fill="url(#fadeG-duplicate-precheck-hol)"/></mask> <linearGradient id="panelG-duplicate-precheck-hol" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="var(--il-panel-top, #FBFBFB)"/> <stop offset="1" stop-color="var(--il-panel, #F2F2F2)"/> </linearGradient> <filter id="lift-duplicate-precheck-hol" x="-60%" y="-60%" width="220%" height="220%"> <feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="var(--il-shadow-c, #221D23)" flood-opacity="var(--il-shadow-o, 0.14)"/> </filter> <filter id="liftL-duplicate-precheck-hol" x="-60%" y="-60%" width="220%" height="220%"> <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="var(--il-shadow-c, #221D23)" flood-opacity="var(--il-shadow-o, 0.14)"/> </filter> </defs> <g mask="url(#fade-duplicate-precheck-hol)"> <path d="M18 18a10 10 0 0 1 10 -10h104a10 10 0 0 1 10 10V160H18z" fill="url(#panelG-duplicate-precheck-hol)" stroke="var(--il-line, #ADABAD)" stroke-width="0.5"/><circle cx="28.0" cy="17.0" r="1.7" fill="var(--il-line, #ADABAD)"/><circle cx="33.5" cy="17.0" r="1.7" fill="var(--il-line, #ADABAD)"/><circle cx="39.0" cy="17.0" r="1.7" fill="var(--il-line, #ADABAD)"/><rect x="18" y="24" width="124" height="0.5" fill="var(--il-line, #ADABAD)" opacity="0.55"/><g opacity="1"><rect x="28.0" y="36.0" width="104.0" height="18.0" rx="7" fill="var(--il-surface, #FFFFFF)" stroke="var(--il-line, #ADABAD)" stroke-width="0.5"/><circle cx="38.0" cy="45.0" r="3.2" fill="none" stroke="var(--il-line, #ADABAD)" stroke-width="0.5"/><rect x="48.0" y="42.8" width="30.0" height="4.4" rx="2.20" fill="var(--il-fill-soft, #E6E5E6)"/></g><g opacity="1"><rect x="28.0" y="60.0" width="104.0" height="18.0" rx="7" fill="var(--il-surface, #FFFFFF)" stroke="var(--il-line, #ADABAD)" stroke-width="0.5"/><circle cx="38.0" cy="69.0" r="3.2" fill="none" stroke="var(--il-line, #ADABAD)" stroke-width="0.5"/><rect x="48.0" y="66.8" width="42.0" height="4.4" rx="2.20" fill="var(--il-fill-soft, #E6E5E6)"/></g><g opacity="0.6"><rect x="28.0" y="84.0" width="104.0" height="18.0" rx="7" fill="var(--il-surface, #FFFFFF)" stroke="var(--il-line, #ADABAD)" stroke-width="0.5"/><circle cx="38.0" cy="93.0" r="3.2" fill="none" stroke="var(--il-line, #ADABAD)" stroke-width="0.5"/><rect x="48.0" y="90.8" width="30.0" height="4.4" rx="2.20" fill="var(--il-fill-soft, #E6E5E6)"/></g> </g> <g class="ila-scan" style="--x:0px;--y:-24px"><g filter="url(#lift-duplicate-precheck-hol)"><rect x="110.5" y="64.5" width="17.0" height="5.1" rx="2.5" fill="var(--il-stroke-soft, #6D5D6F)" transform="rotate(45 100 67)"/><circle cx="100.0" cy="67.0" r="17" fill="var(--il-surface, #FFFFFF)" stroke="var(--il-line, #ADABAD)" stroke-width="0.5"/><rect x="88.0" y="64.0" width="26.0" height="6.2" rx="3.10" fill="var(--il-fill, #D2D2D2)"/></g></g> </svg>
