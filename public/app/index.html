    <!-- Installable as an app from the browser: the manifest names it and
         gives Chrome its icons, the Apple tags do the same for Safari. The
         site is served from the web portal at /app (see app.json baseUrl). -->
    <link rel="manifest" href="/app/manifest.json" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #ffffff;
      }
      #device {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #root {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .device-chrome {
        display: none;
      }

      /* On anything wider than a phone (a laptop browser, the app installed
         on a desktop) the app sits in a phone, the same outline as the web
         portal's mobile invitation email screen, so it reads as the mobile
         app it is. On a phone it fills the screen. */
      @media (min-width: 640px) {
        body {
          display: flex;
          align-items: center;
          justify-content: center;
          background: #e9eef6;
          font-family: Inter, system-ui, sans-serif;
        }
        #device {
          position: relative;
          width: 375px;
          height: min(812px, calc(100% - 64px));
          overflow: hidden;
          border-radius: 44px;
          background: #ffffff;
          box-shadow: 0 0 0 10px #1f1f1f, 0 24px 60px rgba(0, 0, 0, 0.25);
        }
        .device-chrome {
          display: flex;
          flex-shrink: 0;
          color: #1f1f1f;
        }
        /* Drawn over the app, as on a phone: every screen opens on the teal
           band, so the time and icons are white (the app's light status
           bar), and the band reaches up behind them. */
        .status-bar {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          z-index: 1;
          color: #ffffff;
          pointer-events: none;
          height: 44px;
          align-items: center;
          justify-content: space-between;
          padding: 0 20px 0 28px;
          font-size: 15px;
          font-weight: 600;
          letter-spacing: -0.2px;
        }
        /* A white screen (the error states) asks for dark icons, as it
           would of a phone's status bar; see DarkStatusBar in the app. */
        #device.status-dark .status-bar {
          color: #1f1f1f;
        }
        .status-icons {
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .home-indicator {
          height: 28px;
          align-items: flex-start;
          justify-content: center;
          padding-top: 14px;
          box-sizing: border-box;
        }
        .home-indicator span {
          width: 134px;
          height: 5px;
          border-radius: 3px;
          background: #1f1f1f;
        }
      }
    </style>
